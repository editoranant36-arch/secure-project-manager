{% extends "base.html" %}

{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="cyber-card p-5">
            <div class="stat-icon rose mx-auto mb-4" style="width: 72px; height: 72px; font-size: 2.2rem;">
                <i class="fas fa-triangle-exclamation"></i>
            </div>
            <h1 class="display-5 fw-bold text-danger mb-2 font-monospace">{{ code }}</h1>
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <p class="text-secondary small mb-4">{{ message }}</p>
            <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('dashboard.landing') }}" class="btn btn-cyber-primary">
                <i class="fas fa-house me-1"></i> Return to Safety
            </a>
        </div>
    </div>
</div>
{% endblock %}
