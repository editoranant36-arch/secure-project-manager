{% extends "base.html" %}

{% block title %}Forgot Password - Secure Reset{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="cyber-card">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                    <i class="fas fa-unlock-keyhole"></i>
                </div>
                <h3 class="fw-bold">Password Recovery</h3>
                <p class="text-secondary small">Enter your registered email address to receive secure reset instructions.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-4">
                    <label class="form-label" for="resetEmail">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="resetEmail" name="email" placeholder="user@domain.com" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-cyber-primary w-100 py-2">
                    <i class="fas fa-paper-plane me-1"></i> Send Recovery Instructions
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <a href="{{ url_for('auth.login') }}" class="small text-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
